{% extends "base.html" %}
{% block titulo %}Minha conta{% endblock %}
{% block conteudo %}
<div class="porta-conta">
  <h1>Minha conta</h1>
  <p class="lead">{{ usuario.nome }} · {{ usuario.email }}{% if usuario.admin %} · administrador{% endif %}</p>
  <form class="bloco form-conta" method="post">
    <h2 style="margin-top:0">Trocar senha</h2>
    <label for="atual">Senha atual</label>
    <input id="atual" name="atual" type="password" autocomplete="current-password" required>
    <label for="nova">Nova senha <span class="discreto">(mínimo de 8 caracteres)</span></label>
    <input id="nova" name="nova" type="password" autocomplete="new-password" minlength="8" required>
    <button class="botao" type="submit">Trocar senha</button>
  </form>
</div>
{% include "_conta_estilo.html" %}
{% endblock %}
