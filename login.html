{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="porta-conta">
  <h1>Entrar</h1>
  <p class="lead">Suas tentativas, respostas e correções ficam na sua conta e só você as vê.</p>
  <form class="bloco form-conta" method="post">
    <input type="hidden" name="proximo" value="{{ proximo }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button class="botao" type="submit">Entrar</button>
  </form>
  <p>Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
</div>
{% include "_conta_estilo.html" %}
{% endblock %}
